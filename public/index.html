<script>
let retintAgain = false;
function retint() {
  if (!navigator.standalone) return;
  if (document.querySelector("dialog.retint")) {
    retintAgain = true;
    return;
  }
  if (document.querySelector("dialog[open]")) return;
  const probe = document.createElement("dialog");
  probe.className = "retint";
  document.body.append(probe);
  probe.showModal();
  setTimeout(() => {
    probe.remove();
    if (!retintAgain) return;
    retintAgain = false;
    requestAnimationFrame(retint);
  }, 60);
}
retint();
</script>
